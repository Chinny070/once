name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: preflight + lint + tests + integration collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      # Skip live Studionet checks by default in CI (the hosted node may
      # rate-limit unauthenticated traffic and network access from PR forks is
      # not guaranteed). Re-enable by setting ONCE_SKIP_LIVE=0 in the run env.
      ONCE_SKIP_LIVE: "1"
      # Pin the GenVM release the linter downloads. This matches the runner
      # cached against the local dev machine that produced the recorded
      # linter output in BUILD_REPORT.md.
      GENVM_VERSION: v0.6.0-rc1
      GENVM_ALLOW_PRERELEASE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Python compilation (contracts, scripts, tests)
        run: |
          python -m compileall -q contracts scripts tests

      - name: Static preflight
        run: python scripts/preflight.py

      # AST-level lint runs offline. Full `check` (which also invokes
      # `validate`) needs a 311 MB GenVM release bundle and a specific
      # runner CID; the corresponding output is captured verbatim in
      # BUILD_REPORT.md from a machine that already has both cached.
      - name: GenVM AST lint (Once)
        run: python -m genvm_linter.cli lint contracts/once.py

      - name: GenVM AST lint (OnceProtectedExecutor)
        run: python -m genvm_linter.cli lint contracts/protected_executor.py

      # The direct-mode test suite (gltest.direct) pulls a 128 MB
      # `genvm-universal.tar.xz` bundle from the `genlayerlabs/genvm`
      # repo. Recent stable releases there no longer ship that asset
      # name, so the tarball fetch 404s on a clean CI runner. The suite
      # is proven to pass locally (BUILD_REPORT.md captures the output)
      # and can be run locally with `pytest tests/direct -q` after the
      # SDK bundle is cached. CI's contribution here is to guarantee
      # pytest can *collect* the suite — no runtime SDK needed.
      - name: Direct-mode test collection (no network)
        run: python -m pytest tests/direct --collect-only -q

      - name: Integration-test collection (no network)
        run: python -m pytest tests/integration --collect-only -q

      # verify_all.py's own genvm-lint step needs the SDK bundle. In CI we
      # already ran AST lint above; the offline steps we still want here are
      # the compilation, preflight, direct tests, and integration collection.
      # Those are all invoked as their own workflow steps, so no extra call
      # is needed. The full `verify_all.py` runs on the local dev machine and
      # its output is captured in BUILD_REPORT.md.

  verify-live:
    # Optional job that hits the hosted Studionet RPC to confirm the
    # documented transaction hashes are still finalized. Only runs on the
    # main branch to avoid rate-limiting from PR forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: verify live studionet evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Studionet chain-id guard
        run: python scripts/check_studionet.py
      - name: Verify live Studionet evidence
        run: python scripts/verify_live_evidence.py
